<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <title>Minigame Prozess</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="app-container">
    <!-- Startscreen -->
    <div id="start-screen" style="display: flex;">
      <h1>Willkommen zur schlechtesten Nutzererfahrung jemals!</h1>
      <div id="game-description">
        Dies ist ein Spiel, indem du so schnell wie möglich scheinbar einfache und alltägliche Aufgaben erledigen musst.
      </div>
      <button id="ready-btn" class="worst-btn ready">Bereit</button>
      <div style="margin:14px 0 4px 0; font-size:0.95em;">
        Bitte <span id="click-word" class="fake-link">klicke</span> <u>HIER</u> um zu <span
          class="highlight">starten</span>.
      </div>
    </div>

    <!-- Stages -->
    <div id="stages" style="display:none;">
      <h2 id="stage-title"></h2>
      <div id="stage-content"></div>
      <div id="error-msg" class="error"></div>
      <div id="timer">Zeit: <span id="time-value">0.00</span>s</div>
      <button id="submit-btn">Absenden</button>
    </div>

    <!-- Endscreen -->
    <div id="end-screen" style="display:none;">
      <h1>Fertig!</h1>
      <div>Deine Punkte: <span id="score"></span></div>
      <button id="restart-btn">Nochmal spielen</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
