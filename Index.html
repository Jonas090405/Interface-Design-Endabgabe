<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <title>Minigame Prozess</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="app-container">
    <!-- Startscreen -->
    <div id="start-screen" style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
      <h1>Willkommen zur schlechtesten Nutzererfahrung jemals!</h1>
      <div id="game-description">
        Dies ist ein Spiel, indem du so schnell wie möglich scheinbar einfache und alltägliche Aufgaben erledigen musst.
      </div>
      <button id="ready-btn" class="worst-btn ready">Bereit</button>
      <div style="margin:14px 0 4px 0; font-size:0.95em;">
        Bitte <span id="click-word" class="fake-link">klicke</span> <u>HIER</u> um zu <span
          class="highlight">starten</span>.
      </div>
    </div>

    <!-- STAGES -->
    <div id="stages" style="display:none; flex-direction: column; align-items: center; justify-content: center;">
      <h2 id="stage-title"></h2>
      <div id="stage-content"></div>
      <div id="error-msg" style="color:#B20CE9; margin:10px 0;"></div>
      <div class="bottom-ui">
        <p>Zeit: <span id="timer">0.00</span>s</p>
        <button id="submit-btn">Weiter</button>
      </div>
    </div>

    <!-- CHECKOUT SCREEN (nur einmal!) -->
    <div id="checkout-screen" style="display:none; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;">
      <!-- Inhalt wird dynamisch vom JS eingefügt -->
    </div>

    <!-- END SCREEN -->
    <div id="end-screen" style="display:none; flex-direction: column; align-items: center; justify-content: center;">
      <h2>Ergebnis</h2>
      <p>Gesamtpunktzahl: <span id="score">0</span></p>
      <button id="restart-btn">Neustarten</button>
    </div>

  </div>
  <script src="script.js"></script>
</body>

</html>
